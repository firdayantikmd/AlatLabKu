<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>Registration - Your Application</title>

    <link rel="shortcut icon" type="image/x-icon" href="static/img/favicon.png">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/plugins/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="static/plugins/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="account-content">
            <div class="login-wrapper">
                <div class="login-content">
                    <div class="login-userset">
                        <div class="login-logo">
                            <img src="static/img/logo.png" alt="img">
                        </div>
                        <div class="login-userheading">
                            <h3>Buat Akun</h3>
                            <h4>Lanjutkan di bagian terakhir Anda mengisi</h4>
                        </div>

                        <!-- Flash messages for feedback -->
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                <div class="alerts">
                                {% for message in messages %}
                                    <div class="alert alert-info">{{ message }}</div>
                                {% endfor %}
                                </div>
                            {% endif %}
                        {% endwith %}

                        <form action="{{ url_for('user_routes.signup') }}" method="post">
                            <div class="form-login">
                                <label for="username">Username</label>
                                <div class="form-addons">
                                    <input type="text" name="username" placeholder="Masukkan username" required>
                                    <img src="static/img/icons/users1.svg" alt="img">
                                </div>
                            </div>
                            <div class="form-login">
                                <label for="email">Email</label>
                                <div class="form-addons">
                                    <input type="email" name="email" placeholder="Masukkan alamat email" required>
                                    <img src="static/img/icons/mail.svg" alt="img">
                                </div>
                            </div>
                            <div class="form-login">
                                <label for="password">Password</label>
                                <div class="pass-group">
                                    <input type="password" name="password" class="pass-input" placeholder="Masukkan password" required>
                                    <span class="fas toggle-password fa-eye-slash"></span>
                                </div>
                            </div>
                            <div class="form-login">
                                <label for="no_hp">No.HP</label>
                                <div class="form-addons">
                                    <input type="no_hp" name="no_hp" placeholder="Masukkan No.HP" required>
                                    <img src="static/img/icons/hp.svg" alt="img">
                                </div>
                            </div>
                            <div class="form-login">
                                <label for="full_name">Nama Lengkap</label>
                                <div class="form-addons">
                                    <input type="full_name" name="full_name" placeholder="Masukkan Nama Lengkap" required>
                                    <img src="static/img/icons/transfer1.svg" alt="img">
                                </div>
                            </div>
                            <div class="form-login">
                                <label for="student_id">NIM</label>
                                <div class="form-addons">
                                    <input type="student_id" name="student_id" placeholder="Masukkan NIM" required>
                                    <img src="static/img/icons/wallet1.svg" alt="img">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Foto Profil</label>
                                <!-- <div class="image-upload">
                                    <input type="file">
                                    <div class="image-uploads">
                                        <img src="static/img/icons/upload.svg" alt="img">
                                        <h4>Drag and drop a file to upload</h4>
                                    </div>
                                </div> -->
                                <div class="product-list">
                                    <ul class="row">
                                        <li>
                                            <div class="productviews">
                                                <div class="productviewsimg">
                                                    <img id="selfPhotoDisplay" src="{{ url_for('static', filename='img/icons/default_user.png') }}" alt="User Photo">
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                                <div class="image-upload" name="self_photo">
                                    <input type="file" name="self_photo" onchange="previewImage(this, 'selfPhotoDisplay')">
                                    <div class="image-uploads">
                                        <img src="{{ url_for('static', filename='img/icons/upload.svg') }}" alt="img">
                                        <h4>Drag and drop a file to upload</h4>
                                    </div>
                                </div>  
                            </div>
                            <div class="form-login">
                                <button type="submit" class="btn btn-login">Sign Up</button>
                            </div>
                        </form>
                        
                        <div class="signinform text-center">
                            <h4>Sudah punya akun? <a href="{{ url_for('user_routes.signin') }}" class="hover-a">Sign In</a></h4>
                        </div>
                    </div>
                </div>
                <div class="login-img">
                    <img src="static/img/login.png" alt="">
                </div>
            </div>
        </div>
    </div>

    <script src="static/js/jquery-3.6.0.min.js"></script>
    <script src="static/js/feather.min.js"></script>
    <script src="static/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/script.js"></script>

    <script>
        function previewImage(input, imgId) {
            var file = input.files[0];
            if (file) {
                var reader = new FileReader();

                reader.onload = function(e) {
                    document.getElementById(imgId).src = e.target.result;
                }

                reader.readAsDataURL(file);
            }
        }

    </script>
</body>
</html>
